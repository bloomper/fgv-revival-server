spring:
  security:
    oauth2:
      client:
        registration:
          fgv-revival-service:
            # The secret of fgv-revival-service in the committed realm copy, not a real secret
            client-secret: 0mtInqqUtVD0h0XlHQYEGvYo400HhI9X

logging:
  file:
    path: ./build/integrationtest-data/log_data

revival:
  # Scheduled jobs never fire on their own in tests: a test that needs one calls it, so a run at
  # the wrong minute can't hold its lock or change data mid-test
  jobs:
    participant-retention:
      cron-expression: '-'
    mailing-reminders:
      cron-expression: '-'
  base-url: http://localhost:8081
  keycloak:
    admin:
      # The secret of fgv-admin in the committed realm copy, not a real secret
      client-secret: YGXDSS5oiZFf4fnTWfX4LImOToPlVOhF
  mcp:
    authorized-parties: fgv-revival-mcp,fgv-revival-mcp-unbound
