spring:
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    password: ${MYSQL_API_USER_PASSWORD:}
  mail:
    password: ${SMTP_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      jakarta:
        persistence:
          sharedCache:
            mode: UNSPECIFIED
      hibernate:
        transaction:
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
      org.hibernate.envers.audit_table_suffix: _audit
      org.hibernate.envers.audit_strategy: org.hibernate.envers.strategy.internal.ValidityAuditStrategy
      org.hibernate.envers.audit_strategy_validity_store_revend_timestamp: true
      org.hibernate.envers.track_entities_changed_in_revision: true
      org.hibernate.envers.store_data_at_delete: true
  messages:
    basename: messages
    fallback-to-system-locale: false
    encoding: UTF-8
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${fgv-revival.keycloak.url}/realms/${fgv-revival.keycloak.realm}
      client:
        registration:
          fgv-revival-service:
            provider: fgv
            client-id: fgv-revival-service
            client-secret: ${API_KEYCLOAK_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          fgv:
            token-uri: ${fgv-revival.keycloak.url}/realms/${fgv-revival.keycloak.realm}/protocol/openid-connect/token
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  web:
    locale: sv
  graphql:
    schema:
      printer:
        enabled: true
      introspection:
        enabled: false
    http:
      path: /api/graphql
  ai:
    mcp:
      server:
        name: fgv-revival
        version: 1.0.0
        type: SYNC
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /api/mcp
        capabilities:
          resource: false
          prompt: false
          completion: false
        instructions: >-
          Nyuppsättning supports the steering groups of Chalmersspex revivals. Every call runs with the
          permissions of the signed-in user and returns only revivals they can see. No tool deletes anything or
          sends email. The guide is JK/FGV's continuity guide for revivals, in chapters. Guide tools read the
          version a revival is pinned to when you give its id. The decision log holds a revival's decisions, to-dos
          and questions, numbered per revival. Checklists hold what must be done per guide chapter and per event.
          Events are a revival's timeline, from its kickoff and rehearsal weekends to the show weekend; an event
          may have its own checklist, and cancelled events are kept.
          A revival's budget has lines per category, planned in Swedish kronor, and transactions of money that
          came in or went out; only its directeurs and the steering group members with the finance area record
          transactions, and transactions are cancelled in the web, not changed here. Budget summaries never name
          who paid.
          Participants and helpers are listed with their positions, responses and whether their fees are
          paid, never with contact details or dietary needs.
          Staffing lists a revival's shift slots per event with who holds them, by name only. Mailings can only
          be drafted here: a person reviews and sends them in the web.
          Owners and payers are given by display name, or "me".

management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,metrics,info

server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 12MB

logging:
  file:
    path: ./data/log_data

fgv-revival:
  base-url: ${API_BASE_URL:https://api.revival.fgv.local.nu:8443}
  web-url: ${API_WEB_URL:http://localhost:3001}
  time-zone: Europe/Stockholm
  mail:
    from: ${MAIL_FROM:noreply@localhost}
  keycloak:
    url: ${API_KEYCLOAK_URL:https://auth.fgv.local.nu:8443/auth}
    realm: ${API_KEYCLOAK_REALM:fgv}
    admin:
      url: ${fgv-revival.keycloak.url}
      client-id: ${API_KEYCLOAK_ADMIN_CLIENT_ID:fgv-admin}
      client-secret: ${API_KEYCLOAK_ADMIN_CLIENT_SECRET:}
      # Keycloak as super admins' browsers reach it, for the links in the email about members waiting for access
      console-url: ${API_KEYCLOAK_CONSOLE_URL:${fgv-revival.keycloak.url}}
  security:
    authorized-parties: ${FGV_REVIVAL_SECURITY_AUTHORIZED_PARTIES:fgv-revival}
  mcp:
    authorized-parties: ${API_KEYCLOAK_MCP_CLIENT_ID:fgv-revival-mcp}
  spexregister:
    graphql-url: ${API_SPEXREGISTER_GRAPHQL_URL:https://api.register.fgv.local.nu:8443/api/graphql}
  swish:
    # Swish's pre-filled QR code API, which needs no agreement
    qr-url: ${API_SWISH_QR_URL:https://mpc.getswish.net/qrg-swish/api/v1/prefilled}
  data:
    import-sample-data: ${API_IMPORT_SAMPLE_DATA:false}
    sample-user-password: ${SAMPLE_USER_PASSWORD:s3cr3t-s3cr3t}

---
spring:
  config:
    activate:
      on-profile: local
  graphql:
    schema:
      introspection:
        enabled: true

server:
  port: 8081

management:
  server:
    port: 9001
