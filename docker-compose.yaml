name: fgv-revival-server

# Local MySQL for bootRun, picked up by spring-boot-docker-compose. Keycloak runs in Spexregister's local stack.
services:
  mysql:
    image: 'mysql:8.4'
    environment:
      MYSQL_DATABASE: fgvrevival
      MYSQL_USER: fgvrevival
      MYSQL_PASSWORD: fgvrevival
      MYSQL_ROOT_PASSWORD: fgvrevival
    ports:
      - "3307:3306"
    volumes:
      - mysql_db_data:/var/lib/mysql

volumes:
  mysql_db_data:
