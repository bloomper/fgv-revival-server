buildscript {
    dependencies {
        classpath('com.google.cloud.tools:jib-layer-filter-extension-gradle:0.3.0')
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'jacoco'
    id 'com.google.cloud.tools.jib' version '3.5.4'
}

group = 'nu.fgv.revival'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    integrationTest {
        java {
            // The test output too, for the fixtures both test suites share (e.g. GuideTestChapters)
            compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
            srcDir file('src/integrationtest/java')
        }
        resources.srcDir file('src/integrationtest/resources')
        resources.srcDir file('src/main/resources')
    }
}

configurations {
    compileOnly.extendsFrom annotationProcessor
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    asciidoctorExtensions
    mockitoAgent {
        transitive = false
        canBeConsumed = false
        canBeResolved = true
    }

    integrationTestRuntimeClasspath {
        exclude group: 'org.springframework.boot', module: 'spring-boot-devtools'
        exclude group: 'org.springframework.boot', module: 'spring-boot-docker-compose'
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', '2.0.1')
    set('snippetsDir', file('build/generated-snippets'))
}

dependencies {
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    asciidoctorExtensions 'org.springframework.restdocs:spring-restdocs-asciidoctor'

    compileOnly 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.data:spring-data-envers'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'com.graphql-java:graphql-java-extended-scalars:24.0'
    implementation 'io.micrometer:context-propagation:1.2.1'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.springaicommunity:mcp-server-security:0.1.14'
    implementation 'org.keycloak:keycloak-admin-client:26.0.12'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'com.github.librepdf:openpdf:3.0.5'
    implementation 'org.commonmark:commonmark:0.31.0'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-graphql-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'

    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    integrationTestImplementation 'org.testcontainers:testcontainers-mysql'
    integrationTestImplementation 'com.github.dasniko:testcontainers-keycloak:4.4.0'
    integrationTestImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    integrationTestImplementation 'com.icegreen:greenmail-junit5:2.1.14'

    runtimeOnly 'com.mysql:mysql-connector-j'
    if (System.getProperty("os.name").toLowerCase().contains("mac") && System.getProperty("os.arch").toLowerCase().contains("aarch64")) {
        runtimeOnly 'io.netty:netty-resolver-dns-native-macos:4.2.17.Final:osx-aarch_64'
    }

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mockitoAgent('org.mockito:mockito-core:5.24.0') {
        transitive = false
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.testcontainers:testcontainers-bom:2.0.5'
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:all,-processing,-serial', '-Werror']
}

javadoc {
    source = sourceSets.main.allJava
    destinationDir = layout.buildDirectory.dir('docs/javadoc').get().asFile
    title = 'Nyuppsättning Server JavaDoc'
    classpath = sourceSets.main.compileClasspath + sourceSets.main.runtimeClasspath
    options {
        encoding 'UTF-8'
        charSet 'UTF-8'
        author true
        version true
        failOnError true
    }
}

tasks.register('createSnippetsDir') {
    doLast {
        project.mkdir snippetsDir
    }
}

tasks.named('test') {
    outputs.dir snippetsDir
    dependsOn createSnippetsDir

    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}"
}

tasks.register('integrationTest', Test) {
    description = 'Runs the integration tests'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test

    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}"
}

rootProject.tasks.named("processIntegrationTestResources") {
    duplicatesStrategy = 'include'
}

tasks.register('syncRealm', Copy) {
    description = 'Copies fgv-keycloak/realm/fgv.json into the integration test resources'
    group = 'build setup'
    from(file('../fgv-keycloak/realm/fgv.json'))
    into(file('src/integrationtest/resources/realm'))
}

jacocoTestReport {
    dependsOn test, integrationTest
    reports {
        xml.required = true
    }
    additionalSourceDirs.from = files(sourceSets.main.allSource.srcDirs)
    sourceDirectories.from = files(sourceSets.main.allSource.srcDirs)
    classDirectories.from = files(sourceSets.main.output.classesDirs)
    executionData.from = fileTree(layout.buildDirectory).include(
            'jacoco/test.exec',
            'jacoco/integrationTest.exec'
    )
}

check.dependsOn integrationTest, jacocoTestReport

asciidoctorj {
    version = '3.0.0'
}

asciidoctor {
    dependsOn createSnippetsDir, test
    configurations 'asciidoctorExtensions'
    inputs.dir snippetsDir
    sourceDir 'src/main/asciidoc'
    forkOptions {
        jvmArgs '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
                '--add-opens', 'java.base/java.io=ALL-UNNAMED',
                '--enable-native-access=ALL-UNNAMED'
    }
    attributes    \
         'snippets': file('build/generated-snippets')
}

bootJar {
    dependsOn asciidoctor, javadoc
    from("${asciidoctor.outputDir}") {
        into 'static/docs'
    }
    from("${javadoc.destinationDir}") {
        into 'static/docs/javadoc'
    }
}

jib {
    from {
        image = 'eclipse-temurin:25-jre'
        platforms {
            platform {
                architecture = 'amd64'
                os = 'linux'
            }
            platform {
                architecture = 'arm64'
                os = 'linux'
            }
        }
    }
    to {
        image = "bloomper/${project.name}:develop"
    }
    container {
        user = '1000:1000'
    }
    pluginExtensions {
        pluginExtension {
            implementation = 'com.google.cloud.tools.jib.gradle.extension.layerfilter.JibLayerFilterExtension'
            configuration {
                filters {
                    filter {
                        glob = '**/spring-boot-docker-compose-*.jar'
                    }
                    filter {
                        glob = '**/spring-boot-devtools-*.jar'
                    }
                }
            }
        }
    }
    extraDirectories {
        paths {
            path {
                from = "${asciidoctor.outputDir}"
                into = "/app/resources/static/docs"
            }
            path {
                from = "${javadoc.destinationDir}"
                into = "/app/resources/static/docs/javadoc"
            }
        }
    }
}

tasks.named('jib') {
    dependsOn asciidoctor, javadoc
}

jibDockerBuild {
    dependsOn asciidoctor, javadoc
}
